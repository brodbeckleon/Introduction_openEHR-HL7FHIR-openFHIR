grammar: FHIRConnect/v0.0.1
type: model
metadata:
  name: "OBSERVATION.pulse.v2"
  version: 0.0.2a
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: "openEHR-EHR-OBSERVATION.pulse.v2"
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Observation

# Every composition holds exactly one resting heart rate: the day's value, as a POINT_EVENT.
preprocessor:
  fhirConditions:
    - targetRoot: "$resource"
      targetAttribute: "code.coding.code"
      operator: "one of"
      criteria: "40443-4"
    - targetRoot: "$resource"
      targetAttribute: "status"
      operator: "one of"
      criteria: "final"
    - targetRoot: "$resource"
      targetAttribute: "category.coding.code"
      operator: "one of"
      criteria: "vital-signs"

mappings:

  - name: "rate"
    with:
      fhir: "$resource.value"
      openehr: "$archetype/data[at0002]/events[at0003]/data[at0001]/items[at0004]"

  - name: "time"
    with:
      fhir: "$resource.effective"
      openehr: "$archetype/data[at0002]/events[at0003]/time"

  - name: "hardcodedMappings"
    with:
      fhir: "$resource"
      openehr: "$archetype"
    # What openEHR never stored and outgoing FHIR still has to carry. The archetype is the
    # meaning, so the code goes back as a constant — and so does its system, because a Coding
    # without one is not a LOINC code, just a string that looks like one. The display names are
    # left out on purpose: they are the one loss the round trip is allowed to show.
    manual:
      - name: "code"
        fhir:
          # LOINC 40443-4 "Heart rate --resting" — the standard code for this value.
          - path: "code.coding.code"
            value: "40443-4"
          - path: "code.coding.system"
            value: "http://loinc.org"
      - name: "status"
        fhir:
          - path: "status"
            value: "final"
      - name: "category"
        fhir:
          - path: "category.coding.code"
            value: "vital-signs"
          - path: "category.coding.system"
            value: "http://terminology.hl7.org/CodeSystem/observation-category"
