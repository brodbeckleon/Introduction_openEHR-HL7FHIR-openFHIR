plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    hapiVersion = '7.6.0'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // HL7 FHIR R4 model + parser: everything leaving/entering this service is real FHIR.
    implementation "ca.uhn.hapi.fhir:hapi-fhir-base:${hapiVersion}"
    implementation "ca.uhn.hapi.fhir:hapi-fhir-structures-r4:${hapiVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// The pipeline inspector shows the FHIR Connect mappings, so a jar needs its own copy of them.
// At development time MappingLibrary reads openfhir-bootstrap/ directly and these are the fallback.
tasks.named('processResources') {
    from('../openfhir-bootstrap') {
        include '*.yaml'
        into 'mappings'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
