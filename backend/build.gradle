plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    hapiVersion = '8.8.1'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // HL7 FHIR R4 model + parser: everything leaving/entering this service is real FHIR.
    implementation "ca.uhn.hapi.fhir:hapi-fhir-base:${hapiVersion}"
    implementation "ca.uhn.hapi.fhir:hapi-fhir-structures-r4:${hapiVersion}"

    // The FHIR store: Patients as FHIR JSON in one table of this service's own Postgres. Plain JDBC
    // rather than JPA, so nothing touches the database before the first patient is asked for — the
    // service has to start, and draw the chart, with that database down.
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// The mappings and the operational template, copied into the jar. At development time
// MappingLibrary reads openfhir-bootstrap/ directly and these are the fallback — and the shipped
// version the mapping editor resets to. There is no other copy of the template.
tasks.named('processResources') {
    from('../openfhir-bootstrap') {
        include '*.yaml', '*.opt'
        into 'mappings'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
