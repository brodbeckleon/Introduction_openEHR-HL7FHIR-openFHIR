actor.fhirStore=FHIR-Store
explain.patient=Die administrative Hälfte des Records — sie hängt an dem Bundle, in das sie eingefügt wird, statt in der Linie zu liegen: diese Ressource ist nie durch openFHIR gelaufen und war nie eine openEHR-Composition. Sie kommt direkt aus dem FHIR-Store — der eigenen Datenbank dieses Dienstes, in der Patienten als FHIR liegen —, während alles andere auf dem Rückweg aus EHRbase stammt. Deshalb antwortet $everything mit Einträgen aus zwei verschiedenen Speichern, und deshalb sagt nichts darin, welcher woher kommt. Ein Client soll sich darum nicht kümmern müssen. Die Bundle-Stufe darüber nimmt diese Zusammensetzung wieder auseinander, Speicher für Speicher.
explain.patient.summary=Die administrative Hälfte, direkt aus dem FHIR-Store. Sie ist nie durch openFHIR gelaufen und war nie eine openEHR-Composition.
explain.patient.short=Die administrative H\u00e4lfte des Records, die nie durch openFHIR l\u00e4uft.
note.patient=Patient {0} f\u00fchrt seine Messwerte in EHR {1}.
explain.subject=Ein Seitenast, kein Glied in der Kette. Die Observation darüber nennt ein Subject, und dieser Datensatz liegt im FHIR-Store, der eigenen Datenbank dieses Dienstes: Name, Geschlecht, Geburtsdatum, Adresse — nichts davon hat in openEHR einen Platz, denn EHR_STATUS verankert einen Record an einer Kennung und sonst nichts. Nichts weiter unten wird daraus gebaut: der Import schreibt die Referenz und folgt ihr nie, und das Bundle weiter hinten entsteht aus der Observation, nicht hieraus. Wertvoll macht die Referenz erst der Secondary Identifier hier — er trägt die Id des openEHR-Records, bei dem der Hinweg endet, und dieses eine Feld ist die gesamte Verbindung zwischen den beiden Hälften.
explain.subject.summary=Ein Seitenast, kein Glied in der Kette: Der Patient, den die Messung nennt, liegt im FHIR-Store. Sein Secondary Identifier trägt die EHR-Id — dieses eine Feld ist die ganze Verbindung zwischen den beiden Hälften.
explain.subject.short=Das Subject, das die Messung nennt — es liegt im anderen Speicher.
note.subject=Der Import macht diesen Aufruf nicht — das ist die Abfrage, die die Referenz möglich macht. Patient {0} führt seine Messwerte in EHR {1}.
fail.fhirStore=Der FHIR-Store hat nicht geantwortet ({0}). Die Messung ist davon unber\u00fchrt \u2014 die beiden H\u00e4lften werden unabh\u00e4ngig gespeichert, und genau darum geht es bei der Trennung.
step.write=Anlegen oder korrigieren
explain.write.short=Der Schreibzugriff, den der Import machen w\u00fcrde \u2014 gezeigt, nicht gesendet.
explain.write.lead=Die Anfrage, die der Import jetzt senden w\u00fcrde \u2014 und die zwei Fragen, die er vorher gekl\u00e4rt hat, beide an openEHR, beide nur lesend. Welcher Record: eine FHIR-Observation nennt ein Subject, openEHR adressiert ein EHR \u00fcber seine Id, und EHR_STATUS.subject ist die Br\u00fccke \u2014 die erste Abfrage unten findet das EHR von Patient {0} und legt beim ersten Mal eines an. Die Antwort wird gemerkt, diese Abfrage l\u00e4uft also nur beim ersten Trace nach einem Start. Ist der Tag schon belegt: die zweite Abfrage sucht eine Composition an diesem Tag, und sie l\u00e4uft jedes Mal, hier wie im Import.
explain.write.post={0} F\u00fcr diesen Tag gibt es noch keine Composition, also ist es ein POST: EHRbase validiert den Rumpf gegen das operationale Template, speichert ihn als Version 1 einer neuen Composition und antwortet mit 204 und der Version-UID im ETag.
explain.write.summary.post=Hier endet der Hinweg: der Schreibzugriff, den der Import machen würde, gezeigt, aber nicht gesendet. Ein POST, weil es für diesen Tag noch keine Composition gibt.
explain.write.put={0} Dieser Tag h\u00e4lt schon eine Composition, {1}, also ist die Messung eine Korrektur \u2014 und es ist kein POST. openEHR kennt kein \u00dcberschreiben: der Import schickt die neue Composition per PUT an dieselbe UID und nennt in If-Match die Version, die sie ersetzt; EHRbase legt Version 2 an und beh\u00e4lt Version 1 im Record. Das Diagramm zeigt die neueste; die Historie des Tages zeigt beide.
explain.write.summary.put=Hier endet der Hinweg: der Schreibzugriff, den der Import machen würde, gezeigt, aber nicht gesendet. Ein PUT mit If-Match, weil dieser Tag schon eine Composition hat — openEHR legt eine Version an, es überschreibt nie.
query.ehr=welcher Record? openEHR beantwortet das selbst, aus EHR_STATUS.subject
query.sameDay=ist der Tag schon belegt? das entscheidet zwischen POST und PUT
call.sameDay=die Tages-Abfrage; die Anfrage rechts wird nicht gesendet
note.write.dry=Hier endet der Hinweg. Ein Trace schreibt nichts, diese Anfrage wird also nicht gesendet — der Record ist genau, wie er war. Erfasse die Messung über das Formular oder einen Import, dann geht sie so hinaus, wie hier gezeigt, und der Standards-Verkehr zeigt sie.
step.assembled=Beide H\u00e4lften, ein Bundle
explain.assembled=Das, womit GET /fhir/Patient/{id}/$everything antwortet. Die Messwerte sind nach openEHR gegangen und \u00fcber die Mappings zur\u00fcckgekommen; der Patient hat diese Reise nie gemacht, denn diese H\u00e4lfte liegt im FHIR-Store und l\u00e4uft \u00fcberhaupt nie durch openFHIR. Dies ist das einzige Dokument, in dem beide vorkommen \u2014 und nichts darin sagt, welcher Eintrag woher stammt. Genau das ist der Punkt: ein Client soll sich darum nicht k\u00fcmmern m\u00fcssen.
explain.assembled.summary=Das, womit $everything antwortet: die Messwerte aus openEHR und der Patient aus dem FHIR-Store in einem Bundle, ohne dass darin steht, was woher kam. Die Spalten darunter nehmen es wieder auseinander.
explain.assembled.short=Die klinische und die administrative H\u00e4lfte in einem Bundle.
step.composition=openEHR COMPOSITION
