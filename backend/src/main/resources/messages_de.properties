# auch hier stehen, sonst fällt die Anwendung für ihn auf Englisch zurück.
#
# Fachbegriffe bleiben unübersetzt: COMPOSITION, Archetyp, Template, Observation und die
# openEHR-Typnamen sind die Wörter, die in den Spezifikationen und in der JSON-Ansicht stehen.
# Sie einzudeutschen würde das Wiedererkennen genau dort zerstören, wo es gebraucht wird.

