# ── Erklärungen zu den Schritten ──────────────────────────────────────────────
explain.input.bundle=Ein FHIR Bundle, wie es ein externes System schicken würde. Das Backend \
  akzeptiert hier mehrere gleichermaßen korrekte Schreibweisen derselben Sache — /min, {0}/min und \
  bpm meinen dieselbe Frequenz, LOINC 40443-4 und SNOMED 444981005 beide den Ruhepuls — und \
  normalisiert sie im nächsten Schritt.
explain.input.bundle.summary=Ein FHIR-Bundle, wie ein externes System es schicken würde. Gleichwertige Schreibweisen — /min oder bpm, LOINC oder SNOMED — werden hier alle angenommen und im nächsten Schritt vereinheitlicht.
explain.input.observation=Eine einzelne Observation, wie sie ein externes System schicken würde.
explain.input.raw=Die Rohdatei, bevor irgendetwas interpretiert wurde.
explain.input.arrived=Die Observation, wie sie angekommen ist.
explain.input.bundleArrived=Das Bundle, wie es angekommen ist.
explain.observation=Das Backend baut die Messung als eine kanonische Observation neu auf: status \
  final, category vital-signs, LOINC 40443-4, UCUM /min. Diese vier Werte sind keine Zierde — das \
  FHIR-Connect-Mapping prüft genau sie, um überhaupt zu entscheiden, dass diese Ressource ein Puls ist.
explain.bundle=heartrate.context.yaml verankert das Mapping an einem Bundle, deshalb reist auch eine \
  einzelne Messung als Sammlung mit einem Eintrag. Das ist exakt der Rumpf, der zu openFHIR geht.
explain.composition=Dieselbe Messung im openEHR-Referenzmodell. Nichts davon wurde in Java \
  geschrieben: Dieser Dienst hat openFHIR beim Start die FHIR-Connect-Dateien in \
  openfhir-bootstrap/ und das operationale Template übergeben, und openFHIR hat das hier erzeugt. Beachte, wie viel Struktur aufgetaucht ist, die das Bundle \
  nie mitbrachte — composer, language, territory, category, der ITEM_TREE — und dass der LOINC-Code \
  verschwunden ist, weil die Bedeutung in openEHR im Archetyp sitzt.
explain.composition.summary=Dieselbe Messung im openEHR-Referenzmodell, erzeugt von openFHIR aus den Mappings, nicht von Java. Such den LOINC-Code: Er ist weg, weil in openEHR der Archetyp die Bedeutung trägt.
explain.composition.short=openFHIR führt die FHIR-Connect-Mappings aus und antwortet mit einer \
  kanonischen Composition.
explain.aql=Der Rückweg beginnt hier und nicht bei der Mapping-Engine: ein GET fragt den Speicher, was er hält, und erst was herauskommt, wird übersetzt. AQL selektiert über Archetyp-Pfade statt über Tabellenspalten. Deshalb übersteht die Abfrage eine Schemaänderung, an der eine SQL-Abfrage zerbräche: o/data[at0002]/events[at0003] benennt eine Stelle im Puls-Archetyp, und die bedeutet dasselbe in jedem openEHR-System, das diesen Archetyp kennt. Das ist die Abfrage, die GET /fhir/Observation ausführt: sie selektiert ganze Compositions, um jede einzelne an openFHIR zurückzugeben. Das Diagramm nimmt einen kürzeren Weg — sein eigener GET holt Zeitpunkt und Zahl direkt per AQL und berührt openFHIR nie. Gemappt wird nur FHIR, das nach draußen geht.
explain.aql.summary=Der Rückweg beginnt mit einer Abfrage, nicht bei der Mapping-Engine. AQL selektiert über Archetyp-Pfade, deshalb bedeutet die Abfrage dasselbe in jedem openEHR-System, das den Archetyp kennt.
explain.aql.short=AQL ist die Abfragesprache von openEHR: sie selektiert über Archetyp-Pfade, nicht \
  über Tabellenspalten.
explain.roundtrip=Dieselben Mapping-Dateien, in der anderen Richtung ausgeführt — und das ist die Antwort \
  von openFHIR, genau so, wie sie kam. Zwei Dinge daran sind noch nicht das, was ein Client bekommt: die \
  Observation trägt eine Id, die openFHIR sich ausgedacht hat, und sie hat kein Subject, weil nichts in \
  der Composition in FHIR-Begriffen sagt, um wen es geht. Beides richtet das Backend auf der nächsten \
  Stufe. Was openFHIR nicht zurückbringen konnte, steht hier aber schon fest: openEHR hat gespeichert, \
  was der Archetyp modelliert, und alles, was FHIR darüber hinaus mitbrachte, hatte keinen Platz.
explain.roundtrip.summary=Dieselben Mappings in die andere Richtung, genau so, wie openFHIR geantwortet hat. Was openEHR nicht gespeichert hat, kann nicht zurückkommen.
explain.roundtrip.short=Dieselbe Mapping-Definition, in der anderen Richtung ausgeführt.
explain.export=Das, was GET /fhir/Observation liefert. Zwischen der Antwort von openFHIR und dem hier hat \
  das Backend drei Dinge getan: die Id ist jetzt die UID der openEHR-Composition, sodass das Lesen dieser \
  Observation über ihre Id ein Composition-Read ist und keine Tabelle übersetzt; meta.versionId ist die \
  Version der Composition, und so bleibt eine Korrektur auch in FHIR sichtbar; und subject nennt den \
  Patienten, dem der Record gehört. Was unten steht, hat die Reise durch openEHR auch danach nicht \
  überstanden. openEHR hat gar keinen Code gespeichert — der Archetyp ist die Bedeutung —, deshalb \
  schreibt das Mapping den LOINC-Code und sein System als Konstanten zurück; die Anzeigenamen nicht, \
  und die sind der Verlust, den du siehst. Kein Fehler, sondern die Form der beiden Modelle — und eine \
  Entscheidung, wie viel von der Lücke das Mapping überdeckt.
explain.export.summary=Was GET /fhir/Observation ausliefert: Das Backend hat die UID der Composition als Id, ihre Version und das Subject ergänzt. Darunter steht, was die Reise durch openEHR trotzdem verloren hat.
explain.export.short=Die Antwort von openFHIR mit der Composition-UID als Id, ihrer Version und dem Subject.

# ── Hinweise und Fehlschläge ──────────────────────────────────────────────────
note.bundle.rejected={0} Eintrag/Einträge wurden abgelehnt, z. B. {1}.
note.aql.newest=EHRbase hat mit {0} Composition(s) aus den letzten {1} Tagen geantwortet. Die neueste, gemessen {2}, wird zurückverfolgt \u2014 der Messwert, mit dem das Diagramm endet. Was auf dem Hinweg hineingeworfen wurde, spielt hier keine Rolle: ein GET liest, was der Record hält.
fail.bundle.empty=Das Bundle enthält keine Observations.
fail.bundle.unusable=Nichts im Bundle ist ein verwertbarer Ruhepuls: {0}.
fail.observation=Hier endet die Pipeline: diese Observation ist {0}. Gültiges FHIR ist nicht \
  automatisch etwas, das dieser Dienst mappen kann — das Mapping ist gegen genau eine Kodierung \
  geschrieben.
fail.unrecognised=Das ist weder ein FHIR Bundle noch eine FHIR Observation.
fail.openfhir=openFHIR konnte dieses Bundle nicht mappen: {0}
fail.openfhir.empty=openFHIR hat mit einer leeren Composition geantwortet — nichts im Bundle \
  entsprach den Bedingungen in pulse.model.yaml.
fail.ehrbase=EHRbase konnte nicht gefragt werden, um welchen Record es geht: {0}
fail.aql=Die Abfrage ist fehlgeschlagen: {0}
fail.aql.noRecord=Es gibt keinen Record zum Lesen: die EHR ließ sich nicht ermitteln, und genau dort würde ein GET beginnen.
fail.aql.empty=Der Record hält keine Composition aus den letzten {0} Tagen, es gibt also nichts zurückzubringen. Lade die Beispieldaten oder erfasse einen Messwert, und starte den Trace dann erneut.
fail.roundtrip=openFHIR konnte die Composition nicht zurückmappen: {0}

# ── Als was die Eingabe erkannt wurde ─────────────────────────────────────────
kind.bundle=ein FHIR-R4-Bundle
kind.observation=eine einzelne FHIR-R4-Observation
kind.unknown=etwas, das dieser Dienst nicht erkennt

# ── Die Entsprechungen FHIR ⇄ openEHR ─────────────────────────────────────────
link.rate.label=Der Wert selbst
link.rate=Observation.valueQuantity wird zu einer DV_QUANTITY. Beide Modelle tragen eine Zahl und \
  eine Einheit, aber FHIR benennt die Einheit zweimal — einmal menschenlesbar, einmal kodiert aus \
  UCUM — während openEHR eine units-Zeichenkette führt, die der Archetyp ohnehin auf /min \
  einschränkt. Die Einschränkung steckt im Modell, nicht in der Instanz.
link.time.label=Wann gemessen wurde
link.time=Observation.effectiveDateTime wird zur Ereigniszeit eines POINT_EVENT. openEHR macht eine \
  Unterscheidung, die FHIR dem Code überlässt: ein POINT_EVENT ist ein Wert zu einem Zeitpunkt, ein \
  INTERVAL_EVENT mit math_function dagegen "das Minimum über den Tag" oder "der Mittelwert über eine \
  Stunde". Der Archetyp sagt, was von beidem hier vorliegt.
link.code.label=Der Code wählt den Archetyp
link.code=Der LOINC-Code wird in openEHR nicht zu Daten. Er ist eine Bedingung: pulse.model.yaml \
  greift nur bei einer Observation mit Code 40443-4, status final und category vital-signs. Diese \
  Entscheidung ist es, die den Wert im Puls-Archetyp landen lässt — und im Archetyp wohnt jetzt die \
  Bedeutung "das ist eine Herzfrequenz". Eine FHIR-Ressource sagt ihre Bedeutung in Codes, eine \
  openEHR-Composition in ihrer Struktur.
link.entry.label=Bundle-Eintrag in den Composition-Slot
link.entry=Jeder Bundle-Eintrag, der eine Observation enthält, wird in den Puls-Slot der Composition \
  geleitet. Das ist die Regel, die aus einer flachen Liste von Ressourcen eine verschachtelte \
  openEHR-Struktur macht.
link.template.label=Das Template, gegen das validiert wird
link.template=Nichts im FHIR Bundle benennt ein Template — das Backend übergibt templateId als \
  Query-Parameter, und heartrate.context.yaml bindet das Bundle daran. Jede Composition trägt die \
  Template-ID, damit EHRbase weiß, wogegen es validieren soll, und jeder Leser weiß, welche Form ihn \
  erwartet.
link.generated.label=Was openEHR verlangt und FHIR nie geschickt hat
link.generated=composer, language, territory, category und context sind im openEHR-Referenzmodell \
  Pflicht und standen nirgends im Bundle. openFHIR hat sie aus dem Template und eigenen Vorgaben \
  gefüllt. Das ist der ehrliche Preis des Mappings zwischen Modellen: openEHR fragt, wer das \
  aufgezeichnet hat, in welcher Sprache, in welchem Versorgungskontext — und eine FHIR Observation \
  muss darauf keine Antwort haben.

