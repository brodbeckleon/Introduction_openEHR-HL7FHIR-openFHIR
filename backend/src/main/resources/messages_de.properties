explain.patient=Die einzige Stufe, in der es nicht um die Messung geht. Eine Observation nennt ein Subject, und die Frage, wer das ist, f\u00fchrt in einen anderen Speicher: Name, Geschlecht, Geburtsdatum und Adresse liegen in einem gew\u00f6hnlichen FHIR-Server, weil openEHR daf\u00fcr keinen Platz hat \u2014 sein EHR_STATUS verankert einen Record an einer Kennung und sonst nichts. Sieh dir unten den Secondary Identifier an: er tr\u00e4gt die Id des openEHR-Records, in den die n\u00e4chsten Stufen schreiben. Dieses eine Feld ist die gesamte Verbindung zwischen beiden H\u00e4lften. Der Tab \u201eZwei Speicher\u201c zeigt sie wieder zu einem Bundle zusammengesetzt.
explain.patient.short=Die administrative H\u00e4lfte des Records, die nie durch openFHIR l\u00e4uft.
note.patient=Patient {0} f\u00fchrt seine Messwerte in EHR {1}.
fail.fhirStore=Der FHIR-Store hat nicht geantwortet ({0}). Die Messung ist davon unber\u00fchrt \u2014 die beiden H\u00e4lften werden unabh\u00e4ngig gespeichert, und genau darum geht es bei der Trennung.
step.composition=openEHR COMPOSITION
step.stored=In EHRbase gespeichert
