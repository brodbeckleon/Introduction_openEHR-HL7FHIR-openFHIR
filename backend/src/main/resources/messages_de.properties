# ── Die Mapping-Dateien ───────────────────────────────────────────────────────
mapping.context=Der Einstiegspunkt — und die einzige der drei Dateien ohne Regeln. Die anderen \
  beiden beschreiben je einen Archetyp; diese sagt, wann sie überhaupt gelten: dass die FHIR-Seite \
  ein Bundle ist, dass die openEHR-Seite das Template heartrate_monitor.v1 ist, welche Archetypen \
  im Spiel sind, und — `start` — bei welchem davon die Engine anfängt. Ohne sie hätte openFHIR die \
  Regeln und keine Ahnung, wann es sie anwenden soll.
mapping.encounter=Die Composition selbst: sie leitet jeden Bundle-Eintrag, der eine Observation \
  enthält, in den Puls-Slot und macht so aus einer flachen Liste von FHIR-Ressourcen eine \
  verschachtelte openEHR-Struktur. Die Verschachtelung in der Datei entspricht der in den Daten.
mapping.pulse=Die Observation: sie bildet Observation.value auf das Rate-Element des Archetyps ab \
  und effectiveDateTime auf die Ereigniszeit. Ihr `preprocessor` ist der Türsteher — eine \
  Observation ist nur dann ein Puls, wenn sie LOINC 40443-4, status final und category vital-signs \
  trägt — und ihr `manual`-Block schreibt genau diese Codes, samt ihren Systemen, auf dem Weg zurück \
  nach FHIR wieder hinein. Die Anzeigenamen lässt er weg: openEHR hat sie nie gespeichert, und der \
  Rundweg darf das zeigen.

# ── Ablehnungsgründe ──────────────────────────────────────────────────────────
reject.notResting=kein Ruhepuls (keine LOINC-Kodierung 40443-4)
reject.noValue=keine valueQuantity
reject.unit=unerwartete Einheit ''{0}''
reject.noTime=kein effectiveDateTime
reject.notObservation=keine Observation
reject.observation=Observation

# ── Der AQL-Playground ────────────────────────────────────────────────────────
aql.empty=Tippe zuerst eine Abfrage.
aql.notSelect=AQL liest nur. Jede Abfrage beginnt mit SELECT — es gibt kein AQL-Statement, das \
  irgendetwas ändert, und genau deshalb darf dieser Playground ausführen, was du tippst.
aql.chart.label=Die Abfrage, die der Chart ausführt
aql.chart.teaches=Die echte, aus dem Code, den der Chart aufruft, keine Kopie. Jeder Schritt des Pfades ist eine Stelle in \
  einem Archetyp, keine Spalte in einer Tabelle. CONTAINS VERSION steht da, damit die Commit-Zeit mitkommt: \
  ein Tag kann eine Korrektur halten, und der Chart zeigt die zuletzt geschriebene Version. $ehrId und $from \
  werden für dich eingesetzt — der Record auf dem Bildschirm, und dreißig Tage zurück.
aql.whole.label=Eine ganze Composition
aql.whole.teaches=c statt eines Pfades darin zu selektieren liefert die vollständige COMPOSITION so \
  zurück, wie openEHR sie speichert. Beachte: hier steht kein Archetyp-Filter — die Abfrage findet, \
  was auch immer in der Akte liegt.
aql.archetype.label=Welche Archetypen hier drin sind
aql.archetype.teaches=CONTAINS OBSERVATION ohne Archetyp in Klammern trifft jede Observation \
  jeglicher Art. Erst [openEHR-EHR-OBSERVATION.pulse.v2] engt sie ein — der Filter ist der Archetyp, \
  kein Tabellenname.
aql.aggregate.label=Anzahl, Minimum, Maximum, Mittelwert
aql.aggregate.teaches=AQL aggregiert wie SQL, aber über Archetyp-Pfade. Das ist dieselbe Zahl, die \
  der Chart zeigt — nur im Speicher berechnet statt in der Anwendung.
aql.versions.label=Jede Version, nicht nur die aktuelle
aql.versions.teaches=CONTAINS VERSION greift auf die Versionierung zu, die openEHR darunter \
  betreibt: wer was wann committet hat und ob es eine Erzeugung oder eine Änderung war. Ein Tag, den \
  du korrigiert hast, zeigt mehrere Zeilen.
aql.typo.label=Ein Pfad mit einem Tippfehler
aql.typo.teaches=at9999 gibt es im Puls-Archetyp nicht. Sieh dir an, was passiert: es kommen Zeilen \
  zurück, eine pro Observation, jeder Wert null. Ein falscher Pfad ist in AQL kein Fehler — er trifft \
  einfach nichts, und das ist der Fehlermodus, den man kennen sollte.
