sample.rejected.label=A heart rate that is not resting
sample.rejected.summary=LOINC 8867-4 is heart rate, but not the resting one. Watch the pipeline stop.

# ── The mapping files ─────────────────────────────────────────────────────────
mapping.context=The entry point, and the only one of the three with no rules in it. The other two \
  each describe one archetype; this one says when they apply: that the FHIR side is a Bundle, that \
  the openEHR side is the heartrate_monitor.v1 template, which archetypes are in play, and — \
  `start` — which of them is the root the engine begins from. Without it openFHIR would hold the \
  rules and have no idea when to use them.
mapping.encounter=The composition itself: it routes each Bundle entry that holds an Observation \
  into the pulse slot, turning a flat list of FHIR resources into a nested openEHR structure. The \
  nesting in the file mirrors the nesting in the data.
mapping.pulse=The observation: it maps Observation.value onto the archetype's Rate element and \
  effectiveDateTime onto the event time. Its `preprocessor` is the gatekeeper — an Observation is \
  only a pulse if it carries LOINC 40443-4, status final and category vital-signs — and its \
  `manual` block writes those same codes back out on the way to FHIR.

# ── Rejection reasons ─────────────────────────────────────────────────────────
reject.notResting=not a resting heart rate (no LOINC 40443-4 coding)
reject.noValue=no valueQuantity
reject.unit=unexpected unit ''{0}''
reject.noTime=no effectiveDateTime
reject.notObservation=not an Observation
reject.observation=Observation

# ── The AQL playground ────────────────────────────────────────────────────────
aql.empty=Type a query first.
aql.notSelect=AQL only reads. Every query starts with SELECT — there is no AQL statement that \
  changes anything, which is why this playground can run whatever you type.
aql.chart.label=The query the chart runs
aql.chart.teaches=The real one, straight out of the application. Every step of the path is a place \
  in an archetype rather than a column in a table.
aql.whole.label=A whole composition
aql.whole.teaches=Selecting c instead of a path inside it hands back the entire COMPOSITION as \
  openEHR stores it. Note there is no archetype filter here: it finds whatever is in the record.
aql.archetype.label=Which archetypes are in here
aql.archetype.teaches=CONTAINS OBSERVATION with no archetype in brackets matches every observation \
  of any kind. Adding [openEHR-EHR-OBSERVATION.pulse.v2] is what narrows it — the filter is the \
  archetype, not a table name.
aql.aggregate.label=Count, minimum, maximum, mean
aql.aggregate.teaches=AQL aggregates like SQL does, but over archetype paths. This is the same \
  number the chart shows, computed in the store rather than in the application.
aql.versions.label=Every version, not just the current one
aql.versions.teaches=CONTAINS VERSION reaches the versioning openEHR does underneath: who committed \
  what, when, and whether it was a creation or a modification. A day you corrected shows several rows.
aql.typo.label=A path with a typo in it
aql.typo.teaches=at9999 does not exist in the pulse archetype. Watch what happens: rows come back, \
  one per observation, every value null. A wrong path is not an error in AQL — it simply matches \
  nothing, which is the failure mode to know about.
