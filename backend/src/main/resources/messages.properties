# The teaching text of the pipeline inspector, in English. messages_de.properties is the German
# counterpart; every key here must exist there too.
#
# Note for editors: this file is read as ISO-8859-1 unless the encoding is set, which it is
# (spring.messages.encoding), so UTF-8 characters may be written directly.

