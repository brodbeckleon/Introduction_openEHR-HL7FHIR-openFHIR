sample.bundle.label=FHIR Bundle
sample.bundle.summary=Textbook FHIR: LOINC 40443-4, UCUM /min, category vital-signs.
sample.dialect.label=Same thing, spelled differently
sample.dialect.summary=SNOMED instead of LOINC, bpm instead of /min. Equally correct FHIR — see it \
