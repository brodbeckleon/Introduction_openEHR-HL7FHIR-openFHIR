# ── Step explanations ─────────────────────────────────────────────────────────
explain.input.bundle=A FHIR Bundle as an external system would send it. The backend accepts several \
  equally correct spellings of the same thing here — /min, {0}/min and bpm all mean the same rate, \
  and LOINC 40443-4 and SNOMED 444981005 both mean resting heart rate — and normalises them in the \
  next step.
explain.input.bundle.summary=A FHIR Bundle as an external system would send it. Equally correct spellings — /min or bpm, LOINC or SNOMED — are all accepted here and normalised in the next step.
explain.input.observation=A single Observation as an external system would send it.
explain.input.raw=The raw file, before anything has been interpreted.
explain.input.arrived=The Observation as it arrived.
explain.input.bundleArrived=The Bundle as it arrived.
explain.observation=The backend rebuilds the reading as one canonical Observation: status final, \
  category vital-signs, LOINC 40443-4, UCUM /min. Those four values are not decoration — the FHIR \
  Connect mapping matches on them to decide that this resource is a pulse at all.
explain.bundle=heartrate.context.yaml anchors the mapping on a Bundle, so a single reading still \
  travels as a one-entry collection. This is the exact body that goes over the wire to openFHIR.
explain.composition=The same reading in the openEHR reference model. Nothing here was written in \
  Java: this service handed openFHIR the FHIR Connect files in openfhir-bootstrap/ and the \
  operational template when it started, and openFHIR produced this. Note how much structure appeared that the Bundle never carried — composer, \
  language, territory, category, the ITEM_TREE — and that the LOINC code is gone, because in \
  openEHR the meaning sits in the archetype instead.
explain.composition.summary=The same reading in the openEHR reference model, produced by openFHIR from the mappings rather than by Java. Look for the LOINC code: it is gone, because in openEHR the archetype is the meaning.
explain.composition.short=openFHIR executes the FHIR Connect mappings and answers with a canonical \
  composition.
explain.aql=The way back starts here, and not at the mapping engine: a GET asks the store what it holds, and only what comes out of it is translated. AQL selects by archetype path rather than by table column, which is why the query survives a schema change that a SQL query would not — o/data[at0002]/events[at0003] names a place in the pulse archetype, and it means the same thing in every openEHR system that knows that archetype. This is the query GET /fhir/Observation runs, selecting whole compositions to hand each one back to openFHIR. The chart takes a shorter road: its own GET asks AQL for the time and the number directly and never touches openFHIR — only FHIR going out is mapped.
explain.aql.summary=The way back starts with a query, not with the mapping engine. AQL selects by archetype path, so the query means the same in every openEHR system that knows the archetype.
explain.aql.short=AQL is openEHR's query language: it selects by archetype path, not by table column.
explain.roundtrip=The same mapping files, run in the other direction, and this is openFHIR’s answer \
  exactly as it gave it. Two things about it are not yet what a client receives: the Observation carries \
  an id openFHIR made up, and it has no subject, because nothing in the composition says who it is about \
  in FHIR terms. Both are put right in the next stage, by the backend. What openFHIR could not bring \
  back is settled here, though: openEHR stored what the archetype models, and anything FHIR carried \
  beyond that had nowhere to live.
explain.roundtrip.summary=The same mappings run the other way, exactly as openFHIR answered. What openEHR did not store cannot come back.
explain.roundtrip.short=The same mapping definition run in the other direction.
explain.export=What GET /fhir/Observation serves. Between openFHIR’s answer and this, the backend did \
  three things: the id is now the openEHR composition’s uid, so reading this Observation back by id is \
  a composition read and no table translates; meta.versionId is the composition’s version, which is how \
  a correction stays visible in FHIR; and subject names the patient the record belongs to. What is listed \
  below is what did not survive the trip through openEHR even after that. openEHR stored no code at all — \
  the archetype is the meaning — so the LOINC code and its system are written back by the mapping, as \
  constants; the display names are not, and they are the loss you see. Not a bug, but the shape of the two \
  models, and a choice about how much of the gap the mapping papers over.
explain.export.summary=What GET /fhir/Observation serves: the backend has added the composition uid as id, its version and the subject. Listed below is what the trip through openEHR still lost.
explain.export.short=openFHIR’s answer with the composition’s uid as id, its version, and the subject.

