# ── The FHIR ⇄ openEHR correspondences ────────────────────────────────────────
link.rate.label=The value itself
link.rate=Observation.valueQuantity becomes a DV_QUANTITY. Both models carry a number and a unit, \
  but FHIR names the unit twice — a human-readable unit and a coded one from UCUM — while openEHR \
  carries one units string that the archetype already constrains to /min. The constraint lives in \
  the model, not in the instance.
link.time.label=When it was measured
link.time=Observation.effectiveDateTime becomes the event time of a POINT_EVENT. openEHR makes a \
  distinction FHIR leaves to the code: a POINT_EVENT is a value at a moment, while an INTERVAL_EVENT \
  carrying a math_function is "the minimum over the day" or "the mean over an hour". The archetype \
  says which one this is.
link.code.label=The code selects the archetype
link.code=The LOINC code does not become data in openEHR. It is a condition: pulse.model.yaml only \
  applies to an Observation coded 40443-4, with status final and category vital-signs. That decision \
  is what puts the value in the pulse archetype, and the archetype is where the meaning "this is a \
  heart rate" now lives. A FHIR resource says what it means in its codes; an openEHR composition \
  says it in its structure.
link.entry.label=Bundle entry to composition slot
link.entry=Each Bundle entry that holds an Observation is routed into the composition's pulse slot. \
  This is the rule that turns a flat list of resources into a nested openEHR structure.
link.template.label=The template the data is validated against
link.template=Nothing in the FHIR Bundle names a template — the backend passes templateId as a query \
  parameter and heartrate.context.yaml binds the Bundle to it. Every composition carries the template \
  id, so EHRbase knows what to validate against and any reader knows what shape to expect.
link.generated.label=What openEHR demands and FHIR never sent
link.generated=composer, language, territory, category and context are mandatory in the openEHR \
  reference model and were nowhere in the Bundle. openFHIR filled them from the template and its own \
  defaults. This is the honest cost of mapping between models: openEHR asks who recorded this, in \
  what language, in what care setting — and a FHIR Observation does not have to answer.

