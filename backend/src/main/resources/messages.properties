# ── Step explanations ─────────────────────────────────────────────────────────
explain.input.bundle=A FHIR Bundle as an external system would send it. The backend accepts several \
  equally correct spellings of the same thing here — /min, {0}/min and bpm all mean the same rate, \
  and LOINC 40443-4 and SNOMED 444981005 both mean resting heart rate — and normalises them in the \
  next step.
explain.input.observation=A single Observation as an external system would send it.
explain.input.raw=The raw file, before anything has been interpreted.
explain.input.arrived=The Observation as it arrived.
explain.input.bundleArrived=The Bundle as it arrived.
explain.observation=The backend rebuilds the reading as one canonical Observation: status final, \
  category vital-signs, LOINC 40443-4, UCUM /min. Those four values are not decoration — the FHIR \
  Connect mapping matches on them to decide that this resource is a pulse at all.
explain.bundle=heartrate.context.yaml anchors the mapping on a Bundle, so a single reading still \
  travels as a one-entry collection. This is the exact body that goes over the wire to openFHIR.
explain.composition=The same reading in the openEHR reference model. Nothing here was written in \
  Java: openFHIR read the FHIR Connect files in openfhir-bootstrap/ and the operational template, \
  and produced this. Note how much structure appeared that the Bundle never carried — composer, \
  language, territory, category, the ITEM_TREE — and that the LOINC code is gone, because in \
  openEHR the meaning sits in the archetype instead.
explain.composition.short=openFHIR executes the FHIR Connect mappings and answers with a canonical \
  composition.
explain.stored=EHRbase validated the composition against the operational template — a composition \
  that breaks the template is refused, which is where openEHR's guarantees come from — and gave it \
  a version uid. The three parts are the object id, the node that created it, and the version \
  number: every later change adds a version rather than overwriting this one.
explain.stored.short=EHRbase validates the composition against the operational template before \
  storing it.
explain.aql=AQL selects by archetype path rather than by table column, which is why the query \
  survives a schema change that a SQL query would not: o/data[at0002]/events[at0003] names a place \
  in the pulse archetype, and it means the same thing in every openEHR system that knows that \
  archetype. This is the query the chart runs.
explain.aql.short=AQL is openEHR's query language: it selects by archetype path, not by table column.
explain.roundtrip=The same mapping files, run in the other direction — this is what \
  GET /fhir/Observation serves. The round trip is deliberately not lossless: openEHR stored what the \
  archetype models, so anything FHIR carried beyond that has nowhere to live and does not come back. \
  What is listed below is not a bug, it is the shape of the two models.
explain.roundtrip.short=The same mapping definition run in the other direction.

