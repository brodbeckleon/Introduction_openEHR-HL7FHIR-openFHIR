actor.fhirStore=FHIR store
explain.patient=The administrative half of the record, hanging off the Bundle it is joined into rather than lying in the line: this resource never went through openFHIR and was never an openEHR composition. It comes straight out of the FHIR store — this service's own database, where Patients are kept as FHIR — while everything else on the way back came out of EHRbase — which is why $everything answers with entries that arrived from two different places, and why nothing in it says which came from where. A client should not have to care. The Bundle stage above takes that assembly apart again, store by store.
explain.patient.summary=The administrative half, straight out of the FHIR store. It never went through openFHIR and was never an openEHR composition.
explain.patient.short=The administrative half of the record, which never goes through openFHIR.
note.patient=Patient {0} keeps their readings in EHR {1}.
explain.subject=A side branch, not a link in the chain. The Observation above names a subject, and that record lives in the FHIR store, this service's own database: name, gender, birth date, address — none of which openEHR has anywhere to put, because EHR_STATUS anchors a record on an identifier and nothing else. Nothing downstream is built from it: the import writes the reference and never follows it, and the Bundle further along is made out of the Observation, not out of this. What makes the reference worth anything is the secondary identifier here — it carries the id of the openEHR record the way in ends at, and that one field is the entire join between the two halves.
explain.subject.summary=A side branch, not a link in the chain: the patient the reading names lives in the FHIR store. Its secondary identifier carries the EHR id — that one field is the whole join between the two halves.
explain.subject.short=The subject the reading names, which lives in the other store.
note.subject=The import makes no such call — this is the lookup the reference makes possible. Patient {0} keeps their readings in EHR {1}.
fail.fhirStore=The FHIR store did not answer ({0}). The reading is unaffected \u2014 the two halves are stored independently, which is the point of keeping them apart.
step.write=Create or correct
explain.write.short=The write the import would make, shown but not sent.
explain.write.lead=The request the import would send now \u2014 and the two questions it answered before writing, both by asking openEHR and both reads. Which record: a FHIR Observation names a subject, openEHR addresses an EHR by its id, and EHR_STATUS.subject is the bridge \u2014 the first query below finds the EHR that belongs to patient {0}, creating one on first use. The answer is remembered, so this query only runs on the first trace after a start. Whether the day is taken: the second query looks for a composition on this day, and it runs every time, here as in the import.
explain.write.post={0} No composition covers this day yet, so it is a POST: EHRbase validates the body against the operational template, stores it as version 1 of a new composition, and answers 204 with the version uid in an ETag.
explain.write.summary.post=Where the way in ends: the write the import would make, shown but not sent. A POST, because no composition covers this day yet.
explain.write.put={0} This day already holds a composition, {1}, so the reading is a correction \u2014 and it is not a POST. openEHR has no overwrite: the import PUTs the new composition to the same uid, naming in If-Match the version it replaces, and EHRbase adds version 2 while keeping version 1 in the record. The chart shows the newest; the day\u2019s history shows both.
explain.write.summary.put=Where the way in ends: the write the import would make, shown but not sent. A PUT with If-Match, because this day already holds a composition — openEHR adds a version, it never overwrites.
query.ehr=which record? openEHR answers this itself, from EHR_STATUS.subject
query.sameDay=is the day already taken? this decides between POST and PUT
call.sameDay=the same-day query; the request on the right is not sent
note.write.dry=The way in ends here. A trace writes nothing, so this request is not sent \u2014 the record is exactly as it was. Record the reading through the form or an import and it goes out as shown, and the standards traffic shows it.
step.assembled=Both halves, one Bundle
explain.assembled=What GET /fhir/Patient/{id}/$everything answers with. The readings went into openEHR and came back out through the mappings; the patient never made that journey, because that half lives in the FHIR store and never passes through openFHIR at all. This is the only document in which both appear \u2014 and nothing in it says which entry came from where, which is the point: a client should not have to care.
explain.assembled.summary=What $everything answers with: the readings from openEHR and the patient from the FHIR store in one Bundle, with nothing in it saying which came from where. The columns below take it apart again.
explain.assembled.short=The clinical and the administrative half in one Bundle.
step.composition=openEHR COMPOSITION
step.aql=openEHR COMPOSITION
step.roundtrip=FHIR Bundle
step.export=FHIR Bundle, as served

