explain.patient=The one stage that is not about the reading. An Observation names a subject, and answering who that is reaches a different store: name, gender, birth date and address live in an ordinary FHIR server, because openEHR has nowhere to put them \u2014 its EHR_STATUS anchors a record on an identifier and nothing else. Look at the secondary identifier below: it holds the id of the openEHR record the next stages write to. That one field is the entire join between the two halves. The Two stores tab shows them assembled back into one Bundle.
explain.patient.short=The administrative half of the record, which never goes through openFHIR.
note.patient=Patient {0} keeps its readings in EHR {1}.
fail.fhirStore=The FHIR store did not answer ({0}). The reading is unaffected \u2014 the two halves are stored independently, which is the point of keeping them apart.
