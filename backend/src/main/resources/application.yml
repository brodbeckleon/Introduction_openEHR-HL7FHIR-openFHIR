server:
  port: 18080
  tomcat:
    # FHIR writes a token search as system|value, and so does every example of one. Tomcat rejects
    # an unencoded | in a query string unless told otherwise.
    relaxed-query-chars: "|"

spring:
  application:
    name: heartrate-monitor
  messages:
    basename: messages
    encoding: UTF-8
    # Fall back to messages.properties (English) rather than the server's own locale.
    fallback-to-system-locale: false
  jackson:
    default-property-inclusion: non_null
  # The FHIR store: this service's own Postgres, holding the patients. Only ever reached on demand —
  # the pool does not insist on a connection at startup and gives up on one quickly, so with the
  # database down the service still starts, the chart still draws, and the patients fall back to
  # the roster below.
  datasource:
    url: jdbc:postgresql://localhost:18084/fhirstore
    username: fhirstore
    password: fhirstore
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 2000

heartrate:
  template-id: heartrate_monitor.v1
  # The patient a request is about when it names none.
  default-patient: max-mustermann
  # Each patient gets an EHR of its own. The id is the only part openEHR stores — it goes into
  # EHR_STATUS.subject, which is how the EHR is found again after a restart.
  # Seeded into the FHIR store on first start. Only `id` ever reaches openEHR; everything else
  # here is what EHR_STATUS has no room for, which is the reason the FHIR store exists at all.
  patients:
    - id: max-mustermann
      name: Max Mustermann
      birth-date: 1985-03-12
      gender: male
      address:
        line: Kramgasse 49
        postal-code: "3011"
        city: Bern
        country: CH
    - id: erika-musterfrau
      name: Erika Musterfrau
      birth-date: 1971-11-02
      gender: female
      address:
        line: Bahnhofstrasse 12
        postal-code: "8001"
        city: Zürich
        country: CH
  composer-name: Heart rate monitor
  territory: CH
  # Relative to the working directory of `./gradlew bootRun`, i.e. backend/.
  mappings-dir: ../openfhir-bootstrap
  ehrbase:
    base-url: http://localhost:18081/ehrbase
    username: ehrbase-user
    password: SuperSecretPassword
  openfhir:
    base-url: http://localhost:18082

logging:
  level:
    com.example.heartrate: INFO
